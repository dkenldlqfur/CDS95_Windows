name: Publish verified desktop release
on:
  workflow_dispatch:
    inputs:
      staging_ref:
        description: Temporary branch containing verified release chunks
        required: true
      version:
        required: true
        default: '1.3.1'
      runner:
        type: choice
        options: [windows-2025, ubuntu-latest]
        default: windows-2025
permissions:
  contents: write
concurrency:
  group: desktop-release-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.staging_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python .github/publish_staged_release.py
