name: Publish verified desktop release
on:
  workflow_dispatch:
    inputs:
      staging_ref:
        description: Temporary branch containing verified release chunks
        required: true
      version:
        required: true
        default: '1.3.1'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.staging_ref }}
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/publish_staged_release.py
